# Euler zram — 50% RAM con zstd, prio 100 > swapfile
# En 8GB => 4096MB device, ratio 2.5:1 efectiva
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap

# /tmp en zram evita writes SSD para temporales — dinámico para 4GB/8GB+
[zram1]
zram-size = min(ram / 16, 512)
compression-algorithm = zstd
mount-point = /tmp
fs-type = ext2
options = nosuid,nodev,noatime
