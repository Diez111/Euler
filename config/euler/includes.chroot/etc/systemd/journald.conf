# Euler journald — volatil para 0 writes SSD, 32M max
# Storage=volatile => solo RuntimeMaxUse, SystemMaxUse se ignora (queda comentado)
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
MaxRetentionSec=7day
ForwardToSyslog=no
Compress=yes
# SystemMaxUse=50M # ignorado con Storage=volatile, usar RuntimeMaxUse
