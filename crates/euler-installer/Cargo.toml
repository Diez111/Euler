[package]
name = "euler-installer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Euler OS instalador — daemon privilegiado + lógica de instalación"

[[bin]]
name = "euler-installer"
path = "src/main.rs"

[[bin]]
name = "euler-installer-daemon"
path = "src/daemon.rs"

[[bin]]
name = "euler-installer-gui"
path = "src/gui.rs"
required-features = ["gui"]

[features]
gui = []

[dependencies]
euler-core = { path = "../euler-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "=1.0.103"
thiserror = "1.0"
uuid = { version = "=1.20.0", features = ["v4"] }
wait-timeout = "0.2"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
libc = "0.2"
